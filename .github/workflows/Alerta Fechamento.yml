name: Alerta de Fechamento ROC
on:
  schedule:
    # 11:00 UTC = 08:00 de Brasília -> avisa que a importação é HOJE.
    - cron: '0 11 * * *'
    # 15:00 UTC = 12:00 de Brasília -> avisa que a importação é AMANHÃ (véspera).
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qual aviso enviar: hoje, amanha ou ambos'
        required: false
        default: 'ambos'
        type: choice
        options:
          - ambos
          - hoje
          - amanha
jobs:
  enviar-alertas-fechamento:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install psycopg2-binary
      - name: Rodar alerta de fechamento
        env:
          # Cada horário do cron manda um modo diferente. No "Run workflow"
          # manual, vale o que você escolher na lista (padrão: ambos).
          MODO_ALERTA: ${{ github.event.inputs.modo || (github.event.schedule == '0 11 * * *' && 'hoje' || 'amanha') }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REMETENTE_EMAIL: ${{ secrets.REMETENTE_EMAIL }}
          REMETENTE_NOME: ${{ secrets.REMETENTE_NOME }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python alerta_fechamento.py
